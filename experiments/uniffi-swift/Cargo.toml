[package]
name = "avdkit-uniffi-validation"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "staticlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
libc = "0.2"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "sync"] }
uniffi = { version = "0.32.2", default-features = false, features = ["tokio"] }

[workspace]
