[workspace]
members = [
    "crates/model",
    "crates/platform",
    "crates/process",
    "crates/avdfs",
    "crates/drivers",
    "crates/env",
    "crates/core",
    "crates/cli",
    "crates/ffi",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "time"] }
clap = { version = "4", features = ["derive"] }
